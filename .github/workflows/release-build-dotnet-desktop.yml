# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: .NET Core Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-2022
    
    # 强制声明写入权限，解决 403 报错
    permissions:
      contents: write

    env:
      Solution_Name: src/Captura.sln
      Test_Project_Path: src/Test/Tests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Build the application
      run: msbuild $env:Solution_Name -t:rebuild -verbosity:diag -property:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Prepare distribution folder
      run: |
        New-Item -ItemType Directory -Force -Path dist
        New-Item -ItemType Directory -Force -Path temp
        
        $consoleBinFolder = "src/Captura.Console/bin/${{ matrix.configuration }}"
        $uiBinFolder = "src/Captura/bin/${{ matrix.configuration }}"
        
        Copy-Item -Path "licenses" -Destination "dist/licenses" -Recurse -Force
        Copy-Item -Path "$uiBinFolder/Languages" -Destination "dist/languages" -Recurse -Force
        Copy-Item -Path "$consoleBinFolder/*.exe" -Destination "dist/" -Force
        Copy-Item -Path "$uiBinFolder/*.exe" -Destination "dist/" -Force
        
        if (Test-Path "$consoleBinFolder/captura-cli.exe.config") {
          Copy-Item -Path "$consoleBinFolder/captura-cli.exe.config" -Destination "dist/" -Force
        } else {
          Write-Warning "captura-cli.exe.config not found!"
        }
        if (Test-Path "$uiBinFolder/captura.exe.config") {
          Copy-Item -Path "$uiBinFolder/captura.exe.config" -Destination "dist/" -Force
        } else {
          Write-Warning "captura.exe.config not found!"
        }
        
        Copy-Item -Path "$uiBinFolder/keymaps" -Destination "dist/keymaps" -Recurse -Force
        
        New-Item -ItemType Directory -Force -Path "dist/lib" | Out-Null
        
        if (Test-Path "$consoleBinFolder/lib") {
          Copy-Item -Path "$consoleBinFolder/lib/*" -Destination "dist/lib" -Recurse -Force
        }
        if (Test-Path "$uiBinFolder/lib") {
          Copy-Item -Path "$uiBinFolder/lib/*" -Destination "dist/lib" -Recurse -Force
        }
      shell: pwsh
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Package portable version
      run: |
        New-Item -ItemType Directory -Force -Path "dist/Settings"
        New-Item -ItemType Directory -Force -Path "dist/Codecs"
        
        $version = "${{ github.ref_name }}"
        $portableZip = "nCaptura-${version}-Portable.zip"
        Compress-Archive -Path "dist/*" -DestinationPath $portableZip
        echo "PORTABLE_ZIP=$portableZip" >> $env:GITHUB_ENV
        
        Remove-Item -Path "dist/Settings" -Recurse -Force
        Remove-Item -Path "dist/Codecs" -Recurse -Force
      shell: pwsh

    - name: Install Inno Setup
      run: |
        choco install innosetup -y
      shell: pwsh

    - name: Build installer with Inno Setup
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        & $innoPath "/DMyAppVersion=$version" "Inno.iss"
        
        $installerName = "nCaptura-${{ github.ref_name }}-Setup.exe"
        Move-Item -Path "temp/Captura-Setup.exe" -Destination $installerName -Force
        echo "INSTALLER_EXE=$installerName" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nCaptura-${{ github.ref_name }}-Release
        path: |
          ${{ env.PORTABLE_ZIP }}
          ${{ env.INSTALLER_EXE }}
      env:
        Configuration: ${{ matrix.configuration }}
    
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2 # 升级到了 v2 版本
      with:
        files: |
          ${{ env.PORTABLE_ZIP }}
          ${{ env.INSTALLER_EXE }}
        draft: false
        prerelease: false
        name: "nCaptura ${{ github.ref_name }}"
        body: |
          ## nCaptura ${{ github.ref_name }}

          ### What's New

          1. **Recording Status Indicator Border**
             Added a flashing, color-changing border for Region Recording and Window Recording modes. This border provides a clear visual reminder that the screen is currently being recorded.
          2. **Draggable Timestamp Overlay**
             Added a timestamp overlay during recording. You can freely drag it to any position on your screen, and it will be captured in the final video.
          3. **Floating Recording Status Bar**
             Added a floating status bar during recording. It displays the current recording duration, real-time file size, and a pause button with a quick action dialog.
          4. **Enhanced Scheduled Recording & Auto-Shutdown**
             Modified the scheduled recording feature. Now, it supports setting Hours, Minutes, and Seconds. Additionally, added an auto-shutdown option, allowing your PC to automatically shut down after the scheduled recording finishes.

          ### Download

          Choose one:
          - **Installer** (`nCaptura-${{ github.ref_name }}-Setup.exe`) - Recommended for most users
          - **Portable** (`nCaptura-${{ github.ref_name }}-Portable.zip`) - No installation required

          ---
          **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}